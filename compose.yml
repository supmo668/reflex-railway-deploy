services:
  backend:
    build:
      dockerfile: Dockerfile
    ports:
     - 8000:8000
    depends_on:
     - redis
    environment:
      - REDIS_URL=redis://redis
      - REFLEX_ENV_MODE=prod
  
  frontend:
    build:
      dockerfile: web.Dockerfile
    ports:
      - 3000:80
    depends_on:
      - backend
  
  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379
